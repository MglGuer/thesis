name: Compile LaTeX

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3  # Updated to v3

      - name: Set up LaTeX
        run: sudo apt-get update && sudo apt-get install -y texlive-full  # Install texlive-full for LaTeX

      - name: Compile LaTeX document
        run: pdflatex main.tex  # Adjust if your main file is different

      - name: Upload PDF as artifact
        uses: actions/upload-artifact@v3  # Updated to v3
        with:
          name: compiled-pdf
          path: main.pdf  # Adjust the path if necessary
